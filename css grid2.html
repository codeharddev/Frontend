<style>

    .container{
        max-width:660px
        margin:100px auto;
        padding:10px
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:10px;

    
    }
    .item{
        background: steelblue;
        color:#fff;
        font-size:20px;
        padding:20px;
        border:1px solid blue;

        
    }
    .item:nth-of-type(1){
        background-color: #000;
        grid-column:1/3;
        grid-column:1/span2;
        
    }

        </style>
